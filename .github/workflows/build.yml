# Builds a ready-to-run Alcmaeon Lite for Windows, macOS and Linux.
#
# Push this repo to GitHub and the binaries appear under the Actions tab as
# downloadable artifacts -- no build tools, no commands on your own machine.
# Tag a commit (e.g. v1.0.0) and they are attached to a Release as well.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: alcmaeon-lite-windows
          - os: macos-latest
            artifact: alcmaeon-lite-macos
          - os: ubuntu-latest
            artifact: alcmaeon-lite-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm packaging/alcmaeon.spec

      - name: Package macOS bundle
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "Alcmaeon Lite-macos.zip" "Alcmaeon Lite.app"
          rm -rf "Alcmaeon Lite.app"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
